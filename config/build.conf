# Linux Mint Server build configuration. Sourced by scripts/build-in-container.sh.

MINT_RELEASE="22.3"
MINT_CODENAME="zena"
MINT_CODENAME_PRETTY="Zena"
UBUNTU_CODENAME="noble"
ARCH="amd64"

UBUNTU_MIRROR="http://archive.ubuntu.com/ubuntu"
UBUNTU_SECURITY_MIRROR="http://security.ubuntu.com/ubuntu"
MINT_MIRROR="http://packages.linuxmint.com"

# Kernel flavour installed on the server. Mint 22.x ships the HWE kernel.
KERNEL_PACKAGE="linux-generic-hwe-24.04"

# Mask graphical.target on the installed system. systemd always ships the
# unit file; the default target is multi-user.target either way. Masking
# additionally guarantees nothing can ever pull the system into it.
MASK_GRAPHICAL_TARGET="yes"

# Default locale / timezone for the installed system (installer can override tz).
DEFAULT_LOCALE="en_US.UTF-8"
DEFAULT_TIMEZONE="Etc/UTC"

ISO_LABEL="MINT_SERVER_2203"
ISO_NAME="linuxmint-${MINT_RELEASE}-server-${ARCH}.iso"
